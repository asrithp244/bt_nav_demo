# bt_nav_eval — Scenario definitions
#
# Each scenario is a self-contained test case for the closed-loop evaluation
# pipeline.  The runner spawns obstacles before each scenario, sends a
# NavigateToPose goal, collects metrics, then tears down obstacles.
#
# Fields:
#   id                    : unique snake_case identifier
#   description           : human-readable label (appears in report)
#   start_pose            : robot start position (x, y, yaw in radians)
#   goal_pose             : target position  (x, y, yaw in radians)
#   obstacles[]           : list of static box obstacles
#     type                : "static_box" (v1 only)
#     pose: {x, y}        : centre of obstacle in map frame
#     size: {w, h}        : width (x) and height (y) in metres
#   timeout_sec           : scenario fails with TIMEOUT if not done by this time
#   success_threshold_m   : distance to goal centre to declare success
#
# Scenario variety:
#   s001  Straight corridor   — single obstacle, tests basic avoidance
#   s002  Narrow gap          — two walls 0.6 m apart, tests DWB squeeze
#   s003  U-shaped dead end   — forces recovery behaviour
#   s004  T-junction          — goal around a corner
#   s005  Multiple scattered  — five obstacles, tests global planner
#   s006  Long path           — 10 m run, two mid-course obstacles
#   s007  Wall-adjacent goal  — tight final approach, tests local planner precision
#   s008  Diagonal field      — obstacles at 45°, tests angled approach
#   s009  Goal unreachable    — fully blocked (graceful failure regression test)
#   s010  Clear baseline      — no obstacles; sets efficiency ceiling for comparison

scenarios:

  # ─────────────────────────────────────────────────────────────────────────
  # All goal poses are scaled to fit within the turtlebot3_world (~3 m diameter).
  # Robot starts at (0, 0). Max safe goal radius ≈ 1.5 m.
  # ─────────────────────────────────────────────────────────────────────────

  - id: "s001_straight_corridor"
    description: "Straight corridor with one central static obstacle"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    goal_pose:  {x: 1.5, y: 0.0, yaw: 0.0}
    obstacles:
      - type: static_box
        pose: {x: 0.75, y: 0.0}
        size: {w: 0.15, h: 0.5}
    timeout_sec: 45
    success_threshold_m: 0.25

  # ─────────────────────────────────────────────────────────────────────────
  - id: "s002_narrow_gap"
    description: "Two walls forming a 0.6 m gap — tests DWB planner squeeze"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    goal_pose:  {x: 1.5, y: 0.0, yaw: 0.0}
    obstacles:
      - type: static_box
        pose: {x: 0.75, y:  0.45}
        size: {w: 0.15, h: 0.6}
      - type: static_box
        pose: {x: 0.75, y: -0.45}
        size: {w: 0.15, h: 0.6}
    timeout_sec: 60
    success_threshold_m: 0.25

  # ─────────────────────────────────────────────────────────────────────────
  - id: "s003_u_shaped_dead_end"
    description: "U-shaped pocket — robot must detect dead end and recover"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    goal_pose:  {x: 1.2, y: 0.0, yaw: 0.0}
    obstacles:
      # back wall of the U
      - type: static_box
        pose: {x: 1.4, y: 0.0}
        size: {w: 0.15, h: 0.8}
      # top arm
      - type: static_box
        pose: {x: 1.0, y:  0.4}
        size: {w: 0.8, h: 0.15}
      # bottom arm
      - type: static_box
        pose: {x: 1.0, y: -0.4}
        size: {w: 0.8, h: 0.15}
    timeout_sec: 60
    success_threshold_m: 0.25

  # ─────────────────────────────────────────────────────────────────────────
  - id: "s004_t_junction"
    description: "Wall blocks straight path — goal is around the corner"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    goal_pose:  {x: 1.0, y: 1.0, yaw: 1.5708}
    obstacles:
      # vertical wall blocking direct path at x=0.6
      - type: static_box
        pose: {x: 0.6, y: 0.4}
        size: {w: 0.15, h: 1.0}
    timeout_sec: 60
    success_threshold_m: 0.25

  # ─────────────────────────────────────────────────────────────────────────
  - id: "s005_multiple_scattered"
    description: "Five scattered obstacles — exercises global path planner"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    goal_pose:  {x: -1.2, y: 0.8, yaw: 3.14}
    obstacles:
      - type: static_box
        pose: {x: -0.3, y:  0.2}
        size: {w: 0.2, h: 0.2}
      - type: static_box
        pose: {x: -0.6, y: -0.2}
        size: {w: 0.2, h: 0.2}
      - type: static_box
        pose: {x: -0.7, y:  0.5}
        size: {w: 0.2, h: 0.2}
      - type: static_box
        pose: {x: -0.4, y:  0.8}
        size: {w: 0.2, h: 0.2}
      - type: static_box
        pose: {x: -1.0, y:  0.2}
        size: {w: 0.2, h: 0.2}
    timeout_sec: 60
    success_threshold_m: 0.25

  # ─────────────────────────────────────────────────────────────────────────
  - id: "s006_long_path_mid_obstacles"
    description: "Diagonal run with two mid-course obstacles — tests sustained navigation"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    goal_pose:  {x: -1.0, y: -1.0, yaw: -2.356}
    obstacles:
      - type: static_box
        pose: {x: -0.35, y: -0.35}
        size: {w: 0.2, h: 0.3}
      - type: static_box
        pose: {x: -0.7, y: -0.7}
        size: {w: 0.3, h: 0.2}
    timeout_sec: 90
    success_threshold_m: 0.30

  # ─────────────────────────────────────────────────────────────────────────
  - id: "s007_wall_adjacent_goal"
    description: "Goal 0.35 m from a wall — tests precision final approach"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    goal_pose:  {x: 0.0, y: -1.2, yaw: -1.5708}
    obstacles:
      # wall at y = -1.55 (goal is 0.35 m clearance)
      - type: static_box
        pose: {x: 0.0, y: -1.6}
        size: {w: 1.0, h: 0.15}
    timeout_sec: 45
    success_threshold_m: 0.25

  # ─────────────────────────────────────────────────────────────────────────
  - id: "s008_diagonal_obstacle_field"
    description: "Obstacles arranged diagonally — angled approach path"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.7854}
    goal_pose:  {x: 1.0, y: -1.0, yaw: -0.7854}
    obstacles:
      - type: static_box
        pose: {x:  0.3, y: -0.3}
        size: {w: 0.2, h: 0.2}
      - type: static_box
        pose: {x:  0.6, y: -0.6}
        size: {w: 0.2, h: 0.2}
      - type: static_box
        pose: {x:  0.8, y: -0.8}
        size: {w: 0.2, h: 0.2}
    timeout_sec: 60
    success_threshold_m: 0.30

  # ─────────────────────────────────────────────────────────────────────────
  - id: "s009_goal_unreachable"
    description: "Goal completely enclosed — tests graceful FAILURE handling"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    goal_pose:  {x: 1.0, y: 0.0, yaw: 0.0}
    obstacles:
      # tight box enclosure around the goal — planner cannot find path
      - type: static_box
        pose: {x: 1.0, y:  0.35}
        size: {w: 0.8, h: 0.15}
      - type: static_box
        pose: {x: 1.0, y: -0.35}
        size: {w: 0.8, h: 0.15}
      - type: static_box
        pose: {x: 0.6, y:  0.0}
        size: {w: 0.15, h: 0.8}
      - type: static_box
        pose: {x: 1.4, y:  0.0}
        size: {w: 0.15, h: 0.8}
    timeout_sec: 30
    success_threshold_m: 0.25

  # ─────────────────────────────────────────────────────────────────────────
  - id: "s010_clear_baseline"
    description: "No obstacles — baseline efficiency ceiling for comparison"
    start_pose: {x: 0.0, y: 0.0, yaw: 0.0}
    goal_pose:  {x: 1.5, y: 0.0, yaw: 0.0}
    obstacles: []
    timeout_sec: 30
    success_threshold_m: 0.25
